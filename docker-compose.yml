# MongoDB de desarrollo en modo replica set (rs0), necesario para las transacciones (0.9).
# Uso: docker compose up -d mongo
#   MONGO_URI=mongodb://127.0.0.1:27018/brunch-cafe?directConnection=true
# Puerto 27018 en el equipo para no chocar con un Mongo local en 27017.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo-datos:/data/db
    healthcheck:
      # Inicia el replica set la primera vez (idempotente) y comprueba que hay primario
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo-datos:
